name: Add Article

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the article to turn into a podcast episode"
        required: true
        type: string
      voice-model:
        description: "Name of the model to use"
        default: "en_GB-alan-medium"
        required: true
        type: choice
        options:
          - "en_GB-alan-medium"
          - "en_GB-cori-high"
          - "en_GB-jenny_dioco-medium"
          - "en_GB-northern_english_male-medium"
          - "en_GB-southern_english_female-low"

permissions:
  contents: write

jobs:
  generate-episode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code branch
        uses: actions/checkout@v7.0.1
        with:
          path: main

      - name: Checkout episodes branch
        uses: actions/checkout@v7.0.1
        with:
          ref: episodes
          path: episodes
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: "auto"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "main/.python-version"
      - name: Install dependencies
        working-directory: main
        run: |
          uv sync
      - name: Create temporary directory for articlepod data
        id: output-dir
        run: |
          mkdir -p $RUNNER_TEMP/articlepod-data
          echo "output_dir=$RUNNER_TEMP/articlepod-data" >> $GITHUB_OUTPUT
      - name: Generate BAML code
        working-directory: main
        run: |
          uv run baml generate --from baml_src/
      - name: Attempt Trafilatura Download
        id: trafilatura-download
        working-directory: main
        continue-on-error: true
        run: |
          uv run trafilatura -u "${{ inputs.url }}" --with-metadata --output-format "json" > ${{ steps.output-dir.outputs.output_dir }}/article.json
      - name: Cache Playwright Chromium
        if: steps.trafilatura-download.outcome == 'failure'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/requirements.txt', '**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-
      - name: Install Chromium browser
        working-directory: main
        if: steps.trafilatura-download.outcome == 'failure' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install chromium
      - name: Install Playwright system dependencies
        if: steps.trafilatura-download.outcome == 'failure'
        working-directory: main
        run: uv run playwright install-deps chromium
      - name: Get HTML for page
        if: steps.trafilatura-download.outcome == 'failure'
        working-directory: main
        run: |
          uv run articlepod page get-html "${{ inputs.url }}" > ${{ steps.output-dir.outputs.output_dir }}/page.html
      - name: Extract article
        if: steps.trafilatura-download.outcome == 'failure'
        working-directory: main
        run: |
          cat "${{ steps.output-dir.outputs.output_dir }}/page.html" | uv run trafilatura --with-metadata --output-format "json" > ${{ steps.output-dir.outputs.output_dir }}/article.json
      - name: Generate article details
        working-directory: main
        run: |
          uv run articlepod article generate-meta ${{ steps.output-dir.outputs.output_dir }}/article.json "${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}" > ${{ steps.output-dir.outputs.output_dir }}/episode.json
      - name: Get metadata
        id: metadata
        run: |
          slug=$(jq -r '.slug' ${{ steps.output-dir.outputs.output_dir }}/episode.json)
          echo "slug=$slug" >> $GITHUB_OUTPUT
          title=$(jq -r '.title' ${{ steps.output-dir.outputs.output_dir }}/episode.json)
          echo "title=$title" >> $GITHUB_OUTPUT
      - name: Cache Ollama Binary
        id: ollama-binary-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/ollama
          key: ${{ runner.os }}-ollama-binary-v1
          restore-keys: |
            ${{ runner.os }}-ollama-binary-
      - name: Install Ollama Locally
        run: |
          mkdir -p ~/.local/ollama
          if [ ! -x "$HOME/.local/ollama/bin/ollama" ]; then
            curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | tar --zstd -xvf - -C ~/.local/ollama
          fi
          echo "$HOME/.local/ollama/bin" >> $GITHUB_PATH
      - name: Setup Ollama in background with cached model
        background: true
        id: ollama-serve
        run: |
          ollama serve
      - name: Check ollama is Available
        timeout-minutes: 1
        run: |
          until curl -s http://localhost:11434/api/tags > /dev/null; do
            echo "Checked."
            sleep 1
          done
          echo "Available."
      - name: Cache Ollama Models
        id: ollama-cache
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ${{ runner.os }}-ollama-models-llama3.2:3b
          restore-keys: |
            ${{ runner.os }}-ollama-models-
      - name: Pull Ollama Model
        run: |
          ollama pull llama3.2:3b
      - name: Generate podcast script
        working-directory: main
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BAML_LOG: off
        run: |
          uv run articlepod article generate-script ${{ steps.output-dir.outputs.output_dir }}/article.json > ${{ steps.output-dir.outputs.output_dir }}/script.txt
      - name: Stop Ollama
        cancel: ollama-serve
      - name: Upload script
        uses: actions/upload-artifact@v7
        with:
          name: script
          path: ${{ steps.output-dir.outputs.output_dir }}/
      - name: Make models directory
        id: models-dir
        run: |
          mkdir -p ${{ steps.output-dir.outputs.output_dir }}/voice-models
          echo "output_dir=${{ steps.output-dir.outputs.output_dir }}/voice-models" >> $GITHUB_OUTPUT
      - name: Cache piper voice models
        uses: actions/cache@v6
        with:
          path: ${{ steps.models-dir.outputs.output_dir }}/${{ inputs.voice-model }}
          key: piper-voice-model-${{ inputs.voice-model }}
          restore-keys: |
            piper-voice-model-
      - name: Download voice model
        run: |
          mkdir -p ${{ steps.models-dir.outputs.output_dir }}/${{ inputs.voice-model }}
          uvx --from piper-tts python -m piper.download_voices --data-dir ${{ steps.models-dir.outputs.output_dir }}/${{ inputs.voice-model }} ${{ inputs.voice-model }}
      - name: Generate local audio
        working-directory: main
        run: |
          uv run piper --input-file ${{ steps.output-dir.outputs.output_dir }}/script.txt --model ${{ steps.models-dir.outputs.output_dir }}/${{ inputs.voice-model }}/${{ inputs.voice-model }} --output-file ${{ steps.output-dir.outputs.output_dir }}/output.wav
      - name: Install ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Wav to MP3
        run: |
          ffmpeg -i ${{ steps.output-dir.outputs.output_dir }}/output.wav -b:a 128k ${{ steps.output-dir.outputs.output_dir }}/output.mp3
      - name: Upload audio to R2
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: |
            r2 object put --file ${{ steps.output-dir.outputs.output_dir }}/output.mp3 --remote "${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}/${{ steps.metadata.outputs.slug }}.mp3"

      - name: Commit episode
        working-directory: episodes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp ${{ steps.output-dir.outputs.output_dir }}/episode.json ${{ steps.metadata.outputs.slug }}.json
          git add ${{ steps.metadata.outputs.slug }}.json
          git commit -m "Add episode ${{ steps.metadata.outputs.title }}"
          git push origin episodes
