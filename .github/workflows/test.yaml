name: Test

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "baml_src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/test.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "src/python/**"
      - "baml_src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/test.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync
      - name: Run linters
        run: |
          uv run ruff check --output-format=github src/articlepod tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync
      - name: Genrate BAML client
        run: uv run baml generate
      - name: Run tests
        run: uv run pytest tests
  functional-article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync
      - name: Generate BAML code
        run: uv run baml generate --from baml_src/
      - name: Generate meta-data for article
        run: |
          uv run articlepod article generate-meta ./tests/data/example-1/article.json "https://www.example.com" > test-article-episode.json
      - name: Validate meta-data for article
        run: |
          cat test-article-episode.json | jq 'select(.source_url != null)'
          cat test-article-episode.json | jq 'select(.description != null)'